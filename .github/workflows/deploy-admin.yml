name: Deploy Admin Web to Railway

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin_panel/**'
      - '.github/workflows/deploy-admin.yml'

jobs:
  deploy-admin:
    name: Build admin web and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: 'stable'

      - name: Build admin web
        working-directory: apps/admin_panel
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=API_BASE_URL=${{ vars.ADMIN_API_BASE_URL || 'https://doctor-booking-system-production-2bf8.up.railway.app/api/v1' }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: apps/admin_panel
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service admin --detach
