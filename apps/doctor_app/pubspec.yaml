name: doctor_app
description: Doctor Booking System - Doctor Application
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.2
  dio: ^5.5.0+1
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.1
  table_calendar: ^3.1.2
  phosphor_flutter: ^2.1.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  intl: ^0.19.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
