name: patient_app
description: Doctor Booking System - Patient Application
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.2

  # Network
  dio: ^5.5.0+1
  retrofit: ^4.1.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0

  # Google Sign-In (Phase 2)
  google_sign_in: ^6.2.1

  # Storage
  flutter_secure_storage: ^9.2.2
  hive_flutter: ^1.1.0

  # Location & Maps (OpenStreetMap — no API key required)
  geolocator: ^12.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # UI
  responsive_framework: ^1.4.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  table_calendar: ^3.1.2
  pin_code_fields: ^8.0.1
  phosphor_flutter: ^2.1.0

  # Code Generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # i18n (Phase 2)
  flutter_localizations:
    sdk: flutter

  # Utils
  intl: ^0.19.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  retrofit_generator: ^8.1.0

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.4

  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
