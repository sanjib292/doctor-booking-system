version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: doctor-booking-postgres-dev
    environment:
      POSTGRES_DB: doctor_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: doctor-booking-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@doctorbooking.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres-dev-data:
